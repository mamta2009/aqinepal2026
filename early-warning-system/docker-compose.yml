services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ews-api
    restart: unless-stopped
    ports:
      # Host nginx proxies to this host port (container still listens on 8000)
      # Change 8010 if that port is already used on the server
      - "127.0.0.1:8010:8000"
    env_file:
      - ./backend/.env
    # Do not hardcode PUBLIC_API_ORIGIN here — it overrides backend/.env and breaks
    # local Docker (UI would call ews.intelladapt.ai instead of 127.0.0.1:8010).
    # Leave PUBLIC_API_ORIGIN empty in .env for same-origin, or set it explicitly.
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      ALLOW_DEV_REGISTRATION_DB_RESET: "false"
      API_PATH_PREFIX: /api
    # Optional: mount .env so edits apply after restart without rebuild
    volumes:
      - ./backend/.env:/app/backend/.env:ro
      - ./config:/app/config:ro
      # Mount HTML/static so privacy policy and landing updates apply without rebuild
      - ./landing:/app/landing:ro
      - ./frontend:/app/frontend:ro
      - ./docs:/app/docs:ro
      # Mount backend Python so route changes (e.g. /privacy-policy.html) apply after restart
      - ./backend:/app/backend:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
