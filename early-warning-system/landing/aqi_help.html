<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>aqiHelp — Early Warning System</title>
    <link rel="icon" type="image/png" href="/landing-assets/intelladapt-logo.png">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --muted: #94a3b8;
            --text: #e2e8f0;
            --accent: #10b981;
            --line: #334155;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: system-ui, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.55;
            display: flex; flex-direction: column;
        }
        header {
            padding: 12px 20px; border-bottom: 1px solid var(--line);
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
            background: rgba(15,23,42,.95);
        }
        header a { color: var(--accent); font-weight: 700; text-decoration: none; }
        header nav a { color: #cbd5e1; font-weight: 500; margin-left: 16px; font-size: 0.9rem; }
        header nav a:hover { color: #7dd3fc; }
        main { flex: 1; max-width: 820px; margin: 0 auto; padding: 20px; width: 100%; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
        .card {
            background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; margin-bottom: 14px;
        }
        #log {
            min-height: 220px; max-height: min(52vh, 480px); overflow-y: auto;
            font-size: 0.92rem; white-space: pre-wrap; word-break: break-word;
        }
        .msg-user { color: #7dd3fc; margin: 10px 0 4px; }
        .msg-bot { color: #e2e8f0; margin: 0 0 14px; padding-left: 10px; border-left: 3px solid var(--accent); }
        .cites { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
        textarea {
            width: 100%; min-height: 88px; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--line); background: #0f172a; color: var(--text); font-size: 0.95rem;
        }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
        button {
            background: var(--accent); color: #0f172a; border: none; padding: 10px 18px;
            border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
        }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        button.secondary { background: #334155; color: var(--text); }
        #status { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; }
        .warn { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); color: #fcd34d; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 14px; }
    </style>
</head>
<body>
<header>
    <a href="/">← Early Warning</a>
    <nav>
        <a href="/guides">Guides</a>
        <a href="/frontend/index.html">Dashboard</a>
        <a href="/docs" target="_blank" rel="noopener">API docs</a>
    </nav>
</header>
<main>
    <h1>aqiHelp</h1>
    <p class="sub">Answers about how this platform works — grounded in published guides. Not medical advice.</p>
    <div class="warn" id="metaWarn" hidden></div>
    <div class="card">
        <div id="log" aria-live="polite"></div>
        <label for="q">Your question</label>
        <textarea id="q" placeholder="e.g. How do I register for SMS alerts? What is the operator PIN used for?"></textarea>
        <div class="row">
            <button type="button" id="send">Ask aqiHelp</button>
            <button type="button" class="secondary" id="clear">Clear</button>
            <span id="status"></span>
        </div>
    </div>
</main>
<script>
(function () {
    var logEl = document.getElementById('log');
    var qEl = document.getElementById('q');
    var sendBtn = document.getElementById('send');
    var clearBtn = document.getElementById('clear');
    var statusEl = document.getElementById('status');
    var metaWarn = document.getElementById('metaWarn');

    function appendUser(text) {
        var h = document.createElement('div');
        h.className = 'msg-user';
        h.textContent = 'You: ' + text;
        logEl.appendChild(h);
    }
    function appendBot(text, cites) {
        var b = document.createElement('div');
        b.className = 'msg-bot';
        b.textContent = text;
        logEl.appendChild(b);
        if (cites && cites.length) {
            var c = document.createElement('div');
            c.className = 'cites';
            c.textContent = 'Sources (retrieval): ' + cites.map(function (x) {
                return (x.source || '') + (x.heading ? ' · ' + x.heading : '');
            }).join(' · ');
            logEl.appendChild(c);
        }
        logEl.scrollTop = logEl.scrollHeight;
    }

    fetch('/api/help/aqi/meta')
        .then(function (r) { return r.json(); })
        .then(function (j) {
            if (!j.openrouter_configured) {
                metaWarn.hidden = false;
                metaWarn.textContent = 'OpenRouter is not configured on this server (OPENROUTER_API_KEY). aqiHelp cannot answer until it is set.';
            } else if (j.build_error || !j.chunk_count) {
                metaWarn.hidden = false;
                metaWarn.textContent = 'Guide corpus issue: ' + (j.build_error || 'no chunks') + ' — check server logs.';
            }
        })
        .catch(function () { /* ignore */ });

    sendBtn.onclick = async function () {
        var text = (qEl.value || '').trim();
        if (text.length < 2) return;
        statusEl.textContent = '';
        sendBtn.disabled = true;
        appendUser(text);
        qEl.value = '';
        try {
            var r = await fetch('/api/help/aqi/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            var j = await r.json().catch(function () { return {}; });
            if (!r.ok) {
                var det = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || r.status);
                appendBot('Error: ' + det, []);
                statusEl.textContent = '';
            } else {
                appendBot(j.reply || '(empty reply)', j.citations || []);
                if (j.disclaimer) statusEl.textContent = j.disclaimer;
            }
        } catch (e) {
            appendBot('Could not reach the server: ' + String(e.message || e), []);
        }
        sendBtn.disabled = false;
    };

    clearBtn.onclick = function () {
        logEl.innerHTML = '';
        statusEl.textContent = '';
    };

    qEl.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.shiftKey) {
            ev.preventDefault();
            sendBtn.click();
        }
    });
})();
</script>
</body>
</html>
