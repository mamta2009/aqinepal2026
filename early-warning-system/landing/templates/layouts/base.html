<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Early Warning System{% endblock %}</title>
  <link rel="icon" type="image/png" href="/landing-assets/favicon.ico">
  <link rel="apple-touch-icon" href="/landing-assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/landing-assets/css/tokens.css">
  <link rel="stylesheet" href="/landing-assets/css/chrome.css">
  {% block head %}{% endblock %}
</head>

<body class="site-body {% block body_class %}{% endblock %}">
  <a class="site-skip" href="#main">Skip to content</a>
  {% block chrome_header %}{% endblock %}
  <main id="main" class="{% block main_class %}site-main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block chrome_footer %}{% endblock %}
  {% block scripts %}{% endblock %}
  {% block widget %}
  <script src="/landing-assets/aqi-help-widget.js" defer></script>
  {% endblock %}
</body>

</html>
