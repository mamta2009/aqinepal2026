{% extends "layouts/guides.html" %}
{% block title %}{{ title }} — Guides{% endblock %}
{% block main_class %}site-main padded{% endblock %}
{% block guides_head %}
<style>
  .md-back {
    display: inline-block;
    margin: 0 0 1rem;
    color: var(--link);
    font-weight: 600;
    text-decoration: none;
  }

  .md-back:hover {
    text-decoration: underline;
  }

  article.md-body {
    max-width: 52rem;
    margin: 0 auto;
    line-height: 1.62;
    color: var(--text-soft);
  }

  article.md-body h1 {
    font-size: 1.75rem;
    margin-top: 0;
    color: #fff;
  }

  article.md-body h2 {
    margin-top: 1.5rem;
    font-size: 1.2rem;
    border-bottom: 1px solid #334155;
    padding-bottom: .25rem;
    color: #fff;
  }

  article.md-body h3 {
    font-size: 1.05rem;
    margin-top: 1.1rem;
    color: #e2e8f0;
  }

  article.md-body code {
    background: #1e293b;
    padding: .1rem .35rem;
    border-radius: 4px;
    font-size: .9em;
  }

  article.md-body pre {
    background: #020617;
    color: #e2e8f0;
    padding: 1rem;
    border-radius: 8px;
    overflow: auto;
    font-size: .85rem;
  }

  article.md-body pre code {
    background: transparent;
    color: inherit;
    padding: 0;
  }

  article.md-body table {
    border-collapse: collapse;
    width: 100%;
    font-size: .92rem;
  }

  article.md-body th,
  article.md-body td {
    border: 1px solid #334155;
    padding: .4rem .5rem;
    vertical-align: top;
  }

  article.md-body th {
    background: #1e293b;
    text-align: left;
  }
</style>
{% endblock %}
{% block content %}
<a class="md-back" href="/guides">&larr; Guides hub</a>
<article class="md-body">
  {{ content | safe }}
</article>
{% endblock %}
