<div class="container">
        <div class="page-title">
            <h1>Registrant directory</h1>
            <p>
                Enter the shared directory passphrase from <code style="background:#eef2f7;padding:2px 6px;border-radius:4px;">REGISTRATION_DIRECTORY_SECRET</code>
                (set in server <code style="background:#eef2f7;padding:2px 6px;border-radius:4px;">backend/.env</code>).
                Phone numbers are masked in the list unless you explicitly request full numbers.
            </p>
        </div>

        <div class="card">
            <div id="msg" class="msg" role="status"></div>
            <div class="form-row">
                <div class="form-group">
                    <label for="pin">Directory passphrase</label>
                    <div class="pw-row">
                        <input type="password" id="pin" autocomplete="off" placeholder="Passphrase">
                        <button type="button" class="pw-toggle" id="togglePin" aria-label="Show passphrase" aria-pressed="false">Show</button>
                    </div>
                </div>
                <button type="button" class="primary" id="loadBtn">Load list</button>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="unmasked">
                <label for="unmasked">Show full phone / WhatsApp numbers (sensitive — trusted device only)</label>
            </div>
            <p class="meta" id="countLine"></p>
        </div>

        <div class="card" id="tableCard" style="display:none;">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>WhatsApp</th>
                            <th>Type</th>
                            <th>Topics</th>
                            <th>Coverage areas</th>
                            <th>Facility</th>
                            <th>Verified</th>
                            <th>Approval</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const msgEl = document.getElementById('msg');
        const tbody = document.getElementById('tbody');
        const countLine = document.getElementById('countLine');
        const tableCard = document.getElementById('tableCard');
        const loadBtn = document.getElementById('loadBtn');

        (function initPinToggle() {
            const btn = document.getElementById('togglePin');
            const inp = document.getElementById('pin');
            if (!btn || !inp) return;
            btn.addEventListener('click', function () {
                const show = inp.type === 'password';
                inp.type = show ? 'text' : 'password';
                btn.textContent = show ? 'Hide' : 'Show';
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                btn.setAttribute('aria-label', (show ? 'Hide ' : 'Show ') + 'passphrase');
            });
        })();

        function showMsg(text, kind) {
            msgEl.textContent = text;
            msgEl.className = 'msg show ' + (kind || 'info');
        }
        function clearMsg() {
            msgEl.className = 'msg';
            msgEl.textContent = '';
        }

        async function loadDirectory() {
            const pin = document.getElementById('pin').value;
            const unmasked = document.getElementById('unmasked').checked;
            if (!pin.trim()) {
                showMsg('Enter the directory passphrase.', 'err');
                return;
            }
            clearMsg();
            loadBtn.disabled = true;
            const params = new URLSearchParams();
            if (unmasked) params.set('unmasked_phones', 'true');
            const url = '/api/contacts/directory?' + params.toString();
            try {
                const r = await fetch(url, {
                    headers: {
                        'X-Registration-Directory-Secret': pin,
                        'Authorization': 'Bearer ' + pin,
                    },
                });
                if (r.status === 404) {
                    showMsg('Directory feature is not configured (REGISTRATION_DIRECTORY_SECRET not set on server).', 'err');
                    tableCard.style.display = 'none';
                    return;
                }
                if (!r.ok) {
                    const j = await r.json().catch(function () { return {}; });
                    const d = (j.detail && (typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail))) || r.statusText;
                    showMsg('Could not load: ' + d, 'err');
                    tableCard.style.display = 'none';
                    return;
                }
                const data = await r.json();
                countLine.textContent = 'Showing ' + data.count + ' contact(s).';
                tbody.innerHTML = '';
                (data.contacts || []).forEach(function (c) {
                    const tr = document.createElement('tr');
                    var topicsCell = '';
                    if (!Array.isArray(c.environmental_topics)) {
                        topicsCell = 'air & heat (default)';
                    } else if (!c.environmental_topics.length) {
                        topicsCell = '(none)';
                    } else {
                        topicsCell = c.environmental_topics.join(', ');
                    }
                    const coverageDisplay = Array.isArray(c.cities) && c.cities.length
                        ? c.cities.join(', ')
                        : (c.city || '');
                    const facilityDisplay = Array.isArray(c.facility_names) && c.facility_names.length
                        ? c.facility_names.join(' · ')
                        : ((c.facility_name || c.facility_id || '') + '');
                    const cells = [
                        c.name || '',
                        c.email || '',
                        c.phone_number || '',
                        c.whatsapp_number || '',
                        c.contact_type || '',
                        topicsCell,
                        coverageDisplay,
                        facilityDisplay,
                        c.verification_status === 'verified' ? 'yes' : (c.verification_status || ''),
                        (c.approval_status || '(legacy)') + '',
                    ];
                    cells.forEach(function (text) {
                        const td = document.createElement('td');
                        td.textContent = text;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                tableCard.style.display = 'block';
                showMsg('List loaded. Passphrase was not stored in the browser.', 'info');
            } catch (e) {
                showMsg('Network error: ' + e.message, 'err');
                tableCard.style.display = 'none';
            } finally {
                loadBtn.disabled = false;
            }
        }

        document.getElementById('loadBtn').addEventListener('click', loadDirectory);
        document.getElementById('pin').addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') loadDirectory();
        });
    </script>
